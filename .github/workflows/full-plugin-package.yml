name: Diazverso - Full plugin package validation

on:
  push:
    paths:
      - "plugin.json"
      - "skills/**"
      - "assets/**"
      - "schemas/**"
      - "templates/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/full-plugin-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests - Drive E02 read-only discovery
        run: python -m unittest discover -s skills/diazverso-drive-setup/tests -p "test_*.py"
      - name: Unit tests - video metrics K05
        run: python -m unittest discover -s skills/diazverso-criacao-video/tests -p "test_*.py"
      - name: Unit tests - skill routing C06 and context cost C07
        run: python -m unittest discover -s skills/diazverso-contexto-eficiente/tests -p "test_*.py"
      - name: Unit tests - thumbnail briefs and actual-file inspector G02/G03
        run: python -m unittest discover -s skills/diazverso-thumbnail/tests -p "test_*.py"
      - name: Unit tests - Nox Character Lock G01 synthetic fixtures
        run: python -m unittest discover -s skills/diazverso-nox/tests -p "test_*.py"
      - name: Unit tests - Shorts preset, captions, QA
        run: python -m unittest discover -s skills/diazverso-shorts/tests -p "test_*.py"
      - name: Unit tests - Remotion contract H01 and H08 preview runner
        run: python -m unittest discover -s skills/diazverso-decupagem/tests -p "test_*.py"
      - name: Unit tests - motion/audio H03-H07 geometry, words, CRT and SFX
        run: node --test skills/diazverso-decupagem/tests/test_motion_math.mjs skills/diazverso-decupagem/tests/test_kinetic_text.mjs skills/diazverso-decupagem/tests/test_crt_panel.mjs skills/diazverso-decupagem/tests/test_audio_plan.mjs
      - name: Unit tests - selected HQMotion port G05
        run: node --test skills/diazverso-decupagem/tests/test_hq_legacy_port.mjs
      - name: Install independent Remotion smoke runner
        working-directory: skills/diazverso-decupagem/runtime
        run: npm install --no-audit --no-fund
      - name: Test independent Remotion runtime helpers
        working-directory: skills/diazverso-decupagem/runtime
        run: npm test
      - name: Render synthetic reference scene 16:9 and 9:16
        working-directory: skills/diazverso-decupagem/runtime
        run: |
          mkdir -p out
          npx --no-install remotion browser ensure
          npx --no-install remotion still src/index.ts DiazversoSmokeWide out/smoke-16x9.png --frame=15
          npx --no-install remotion still src/index.ts DiazversoSmoke out/smoke-9x16.png --frame=15
          npx --no-install remotion render src/index.ts DiazversoSmokeWide out/smoke-16x9.mp4 --frames=0-29 --codec=h264
          npx --no-install remotion render src/index.ts DiazversoSmoke out/smoke-9x16.mp4 --frames=0-29 --codec=h264
          python - <<'PY'
          from pathlib import Path
          import struct,subprocess
          for suffix,(w,h) in {"16x9":(1920,1080),"9x16":(1080,1920)}.items():
              png=Path(f"out/smoke-{suffix}.png")
              assert png.read_bytes()[:8]==bytes.fromhex("89504e470d0a1a0a"),png
              assert struct.unpack(">II",png.read_bytes()[16:24])==(w,h),png
              mp4=Path(f"out/smoke-{suffix}.mp4")
              assert mp4.stat().st_size>1024,mp4
              cmd=["ffprobe","-v","error","-select_streams","v:0","-show_entries",
                   "stream=width,height","-of","csv=p=0",str(mp4)]
              dims=subprocess.check_output(cmd,text=True).strip()
              assert dims==f"{w},{h}",(mp4,dims)
              print("RENDER_VERIFIED",suffix,w,h,mp4.stat().st_size)
          PY
      - name: Archive synthetic Remotion frames and short clips for visual review
        uses: actions/upload-artifact@v4
        with:
          name: diazverso-remotion-smoke-16x9-9x16
          path: |
            skills/diazverso-decupagem/runtime/out/smoke-16x9.png
            skills/diazverso-decupagem/runtime/out/smoke-9x16.png
            skills/diazverso-decupagem/runtime/out/smoke-16x9.mp4
            skills/diazverso-decupagem/runtime/out/smoke-9x16.mp4
          if-no-files-found: error
          retention-days: 7
      - name: Validate complete plugin and build ZIP
        run: python scripts/build_diazverso_plugin.py --output "$RUNNER_TEMP/diazverso-plugin-full.zip"
      - name: Unit tests - offline package structure D07 and L06
        run: python -m unittest discover -s tests -p "test_verify_offline_package.py"
      - name: Verify ZIP contents without any Drive connection
        run: python scripts/verify_offline_package.py "$RUNNER_TEMP/diazverso-plugin-full.zip"
      - name: Publish private test artifact
        uses: actions/upload-artifact@v4
        with:
          name: diazverso-plugin-full-test
          path: ${{ runner.temp }}/diazverso-plugin-full.zip
          if-no-files-found: error
          retention-days: 7
