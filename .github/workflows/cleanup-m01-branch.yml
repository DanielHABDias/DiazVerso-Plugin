name: Diazverso - Remove merged M01 branch (one time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-m01-branch.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-m01-feature:
    if: github.repository == 'DanielHABDias/DiazVerso-Plugin'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Delete only the reviewed and merged M01 branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: feature/tarefa-88-contexto-eficiente
          EXPECTED_HEAD: dff36d5ce30230bd7d6ac38084547cc644607f7d
        run: |
          set -euo pipefail
          merged="$(gh api "repos/$GH_REPO/pulls/2" --jq '.merged')"
          test "$merged" = "true" || { echo "PR #2 is not merged"; exit 1; }
          actual="$(gh api "repos/$GH_REPO/git/ref/heads/$REF_NAME" --jq '.object.sha')"
          test "$actual" = "$EXPECTED_HEAD" || { echo "Branch changed: refusing deletion"; exit 1; }
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$REF_NAME"
          echo "Deleted only $REF_NAME after merge verification"
