name: Diazverso - L02 and L03 independent integrated video tests

on:
  push:
    branches: [main]
    paths:
      - "skills/diazverso-decupagem/runtime/**"
      - ".github/workflows/integrated-video-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install offline development TTS and visual QA dependencies
        run: |
          if ! command -v espeak-ng >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq espeak-ng || {
              sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq espeak-ng
            }
          fi
          python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Test script-to-render timeline generator
        run: python -m unittest discover -s skills/diazverso-decupagem/runtime/scripts -p "test_*.py"
      - name: Install independent Remotion sandbox (never install Diazverso plugin)
        working-directory: skills/diazverso-decupagem/runtime
        run: npm install --no-audit --no-fund
      - name: Compile generated shot list, Nox, local speech WAV, SRT and H01 contract
        working-directory: skills/diazverso-decupagem/runtime
        run: |
          mkdir -p out
          python scripts/prepare_i04_assets.py --repo "$GITHUB_WORKSPACE" --public public
          python scripts/build_integrated_demos.py
          npx --no-install remotion browser ensure
      - name: Render genuine Remotion wide video from script-to-timed-shot-list
        working-directory: skills/diazverso-decupagem/runtime
        run: |
          npx --no-install remotion still src/index.ts DiazversoIntegratedWide out/l02-frame-30.png --frame=30 --props=out/l02-input.json
          npx --no-install remotion still src/index.ts DiazversoIntegratedWide out/l02-frame-235.png --frame=235 --props=out/l02-input.json
          npx --no-install remotion still src/index.ts DiazversoIntegratedWide out/l02-frame-540.png --frame=540 --props=out/l02-input.json
          npx --no-install remotion render src/index.ts DiazversoIntegratedWide out/l02.mp4 --frames=0-599 --codec=h264 --props=out/l02-input.json
      - name: Render genuine Remotion vertical Short with speech captions and contextual CTA
        working-directory: skills/diazverso-decupagem/runtime
        run: |
          npx --no-install remotion still src/index.ts DiazversoIntegratedShort out/l03-frame-20.png --frame=20 --props=out/l03-input.json
          npx --no-install remotion still src/index.ts DiazversoIntegratedShort out/l03-frame-171.png --frame=171 --props=out/l03-input.json
          npx --no-install remotion still src/index.ts DiazversoIntegratedShort out/l03-frame-300.png --frame=300 --props=out/l03-input.json
          npx --no-install remotion render src/index.ts DiazversoIntegratedShort out/l03.mp4 --frames=0-404 --codec=h264 --props=out/l03-input.json
      - name: Independently validate actual MP4, PNG, voice WAV and caption timings
        working-directory: skills/diazverso-decupagem/runtime
        run: python scripts/review_integrated_outputs.py out public
      - name: Preserve real horizontal and vertical test renders for visual/audio review
        uses: actions/upload-artifact@v4
        with:
          name: diazverso-l02-l03-script-to-render-real-media
          path: |
            skills/diazverso-decupagem/runtime/out/l02.mp4
            skills/diazverso-decupagem/runtime/out/l03.mp4
            skills/diazverso-decupagem/runtime/out/l02-frame-*.png
            skills/diazverso-decupagem/runtime/out/l03-frame-*.png
            skills/diazverso-decupagem/runtime/out/l02-input.json
            skills/diazverso-decupagem/runtime/out/l03-input.json
            skills/diazverso-decupagem/runtime/out/l02-h01.json
            skills/diazverso-decupagem/runtime/out/l03-h01.json
            skills/diazverso-decupagem/runtime/out/l02-captions.srt
            skills/diazverso-decupagem/runtime/out/l03-captions.srt
            skills/diazverso-decupagem/runtime/out/l02-timing-evidence.json
            skills/diazverso-decupagem/runtime/out/l03-timing-evidence.json
            skills/diazverso-decupagem/runtime/out/l02-qa.json
            skills/diazverso-decupagem/runtime/out/l03-qa.json
          if-no-files-found: error
          retention-days: 7
