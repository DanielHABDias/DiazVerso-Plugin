name: Diazverso - Independent Remotion smoke validation
on:
  push:
    paths:
      - "skills/diazverso-decupagem/runtime/**"
      - "skills/diazverso-decupagem/references/motion/motion-math.mjs"
      - "skills/diazverso-decupagem/references/motion/kinetic-text-math.mjs"
      - ".github/workflows/smoke-remotion-independent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remotion-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skills/diazverso-decupagem/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact independent Remotion dependencies
        run: npm install --no-audit --no-fund
      - name: Render synthetic PNG
        run: npm run render:still
      - name: Render synthetic 10 frame MP4
        run: npx --no-install remotion render src/index.ts DiazversoSmoke out/smoke.mp4 --frames=0-9 --codec=h264 --overwrite=false
      - name: Assert rendered media signatures, not just exit codes
        run: |
          node -e "const fs=require('fs');const p=fs.readFileSync('out/smoke.png');if(p.subarray(0,8).toString('hex')!=='89504e470d0a1a0a')process.exit(1);const v=fs.readFileSync('out/smoke.mp4');if(v.length<100||v.toString('ascii',4,8)!=='ftyp')process.exit(1);console.log('PNG + MP4 headers valid, sizes',p.length,v.length)"
      - name: Store smoke-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: diazverso-remotion-smoke
          path: |
            skills/diazverso-decupagem/runtime/out/smoke.png
            skills/diazverso-decupagem/runtime/out/smoke.mp4
          retention-days: 7
