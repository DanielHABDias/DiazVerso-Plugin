name: Diazverso - Google Docs request generator tests

on:
  push:
    paths:
      - "skills/diazverso-roteiro/**"
      - "templates/**"
      - ".github/workflows/test-roteiro-requests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Google Docs request generation
        run: python -m unittest discover -s skills/diazverso-roteiro/tests -p "test_*.py" -v
      - name: Generate sample LONGO and SHORT without modifying Google Drive
        run: |
          python skills/diazverso-roteiro/scripts/build_requests.py --tipo LONGO --id VD_0031 --tema "Teste de tese" --output "$RUNNER_TEMP/longo.json"
          python skills/diazverso-roteiro/scripts/build_requests.py --tipo SHORT --id SH_0049 --tema "Teste de hook" --output "$RUNNER_TEMP/short.json"
          python -c "import json,sys; a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2])); assert a['expected']['host_writing'] == 'NOT_EXECUTED'; assert b['expected']['sheet_sync'] == 'NOT_EXECUTED'; print('REQUESTS_VALIDATED', len(a['requests']), len(b['requests']))" "$RUNNER_TEMP/longo.json" "$RUNNER_TEMP/short.json"
